  <circle cx="656" cy="404" r="14" fill="#1E2A5A"/><rect x="642" y="420" width="28" height="22" rx="8" fill="#1E2A5A"/>
  <circle cx="512" cy="524" r="14" fill="#1E2A5A"/><rect x="498" y="540" width="28" height="22" rx="8" fill="#1E2A5A"/>
  <circle cx="368" cy="644" r="14" fill="#1E2A5A"/><rect x="354" y="660" width="28" height="22" rx="8" fill="#1E2A5A"/>
